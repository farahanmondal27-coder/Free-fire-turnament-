
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Registration</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #0d0b18;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            background: #141226;
            padding: 40px 20px;
            border-radius: 16px;
            border: 1px solid #28244d;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 90%;
        }

        h2 {
            margin-bottom: 10px;
            font-size: 24px;
            letter-spacing: 1px;
        }

        p {
            color: #a09cb0;
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* Register Button */
        .register-btn {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 198, 255, 0.4);
        }

        .register-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 198, 255, 0.6);
        }

        /* Modal Overlay */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        /* Modal Content */
        .modal-content {
            background: #1a1733;
            padding: 30px;
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
            border: 1px solid #3b356b;
            position: relative;
            text-align: left;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 22px;
            color: #a09cb0;
            cursor: pointer;
        }

        .close-btn:hover {
            color: #fff;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            color: #c4c0db;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #3b356b;
            background: #0d0b18;
            color: #fff;
            outline: none;
            font-size: 14px;
        }

        .form-group input:focus {
            border-color: #00c6ff;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }

        #form-status {
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>JOIN THE TOURNAMENT</h2>
        <p>Complete your registration to secure your team spot.</p>
        <button class="register-btn" id="openModalBtn">REGISTER NOW</button>
    </div>

    <!-- Registration Form Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <span class="close-btn" id="closeModalBtn">&times;</span>
            <h3 style="margin-bottom: 20px; text-align: center;">Tournament Registration</h3>
            
            <form id="registrationForm">
                <!-- আপনার Web3Forms Access Key এখানে বসাবেন -->
                <input type="hidden" name="access_key" value="YOUR_ACCESS_KEY_HERE">

                <div class="form-group">
                    <label>Player / Team Leader Name</label>
                    <input type="text" name="name" required placeholder="Enter full name">
                </div>

                <div class="form-group">
                    <label>In-Game ID / UID</label>
                    <input type="text" name="player_id" required placeholder="Enter Game UID">
                </div>

                <div class="form-group">
                    <label>WhatsApp Number</label>
                    <input type="tel" name="phone" required placeholder="Enter WhatsApp number">
                </div>

                <button type="submit" class="submit-btn">Submit Registration</button>
                <div id="form-status"></div>
            </form>
        </div>
    </div>

    <script>
        const openModalBtn = document.getElementById('openModalBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const modalOverlay = document.getElementById('modalOverlay');
        const form = document.getElementById('registrationForm');
        const formStatus = document.getElementById('form-status');

        // Modal Open/Close logic
        openModalBtn.addEventListener('click', () => {
            modalOverlay.style.display = 'flex';
        });

        closeModalBtn.addEventListener('click', () => {
            modalOverlay.style.display = 'none';
        });

        window.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                modalOverlay.style.display = 'none';
            }
        });

        // Form Submit handler
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            formStatus.style.color = '#00c6ff';
            formStatus.innerHTML = "Submitting...";

            const formData = new FormData(form);

            fetch('https://api.web3forms.com/submit', {
                method: 'POST',
                body: formData
            })
            .then(async (response) => {
                let json = await response.json();
                if (response.status == 200) {
                    formStatus.style.color = '#00ff88';
                    formStatus.innerHTML = "Registration Successful!";
                    form.reset();
                    setTimeout(() => {
                        modalOverlay.style.display = 'none';
                        formStatus.innerHTML = "";
                    }, 2000);
                } else {
                    formStatus.style.color = '#ff4d4d';
                    formStatus.innerHTML = json.message;
                }
            })
            .catch(error => {
                formStatus.style.color = '#ff4d4d';
                formStatus.innerHTML = "Something went wrong!";
            });
        });
    </script>
</body>
</html>
